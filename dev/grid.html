<!doctype html><html><body style="margin:0;background:#111"><canvas id="c" width="1200" height="1200"></canvas>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from '../vendor/addons/loaders/GLTFLoader.js';
const cv=document.getElementById('c');const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});
r.setScissorTest(true);
const s=new THREE.Scene();s.background=new THREE.Color(0x222831);
s.add(new THREE.HemisphereLight(0xffffff,0x888899,2.4));
const cam=new THREE.PerspectiveCamera(35,1,.01,100);
new GLTFLoader().load('../models/male_reproductive_system.glb',g=>{
  const root=g.scene;s.add(root);const meshes=[];root.traverse(o=>{if(o.isMesh)meshes.push(o)});
  const B=new THREE.Box3().setFromObject(root);const c=B.getCenter(new THREE.Vector3());const R=Math.max(...B.getSize(new THREE.Vector3()).toArray());
  cam.position.set(c.x,c.y,c.z+R*1.7);cam.lookAt(c);
  const ctx=document.createElement('canvas');
  meshes.forEach((m,i)=>{
    meshes.forEach(o=>o.visible=(o===m));
    const x=(i%4)*300,y=(3-Math.floor(i/4))*300;r.setViewport(x,y,300,300);r.setScissor(x,y,300,300);r.render(s,cam);
  });
  const names=meshes.map((m,i)=>i+':'+m.name.split('_')[0]);console.log(names.join(' | '));
  window.DONE=true;
});
</script></body></html>
