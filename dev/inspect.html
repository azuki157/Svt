<!doctype html><html><body style="margin:0;background:#111"><canvas id="c" width="900" height="700"></canvas>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from '../vendor/addons/loaders/GLTFLoader.js';
const q=new URLSearchParams(location.search);const file=q.get('f');const rx=+q.get('rx')||0, ry=+q.get('ry')||0;
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
const s=new THREE.Scene();s.background=new THREE.Color(0x222831);
s.add(new THREE.HemisphereLight(0xffffff,0x444455,2.2));const d=new THREE.DirectionalLight(0xffffff,2);d.position.set(3,5,4);s.add(d);
const cam=new THREE.PerspectiveCamera(35,900/700,.01,100);
new GLTFLoader().load('../models/'+file,g=>{
  const root=g.scene;s.add(root);
  root.rotation.x=rx;root.rotation.y=ry;root.updateMatrixWorld(true);
  const b=new THREE.Box3().setFromObject(root);const c=b.getCenter(new THREE.Vector3());const sz=b.getSize(new THREE.Vector3());
  console.log('BBOX',JSON.stringify(sz),JSON.stringify(c));
  const R=Math.max(sz.x,sz.y,sz.z);cam.position.set(c.x,c.y,c.z+R*2.2);cam.lookAt(c);
  r.render(s,cam);window.DONE=true;
});
</script></body></html>
